:root{--bg:#efe6da;--ink:#3b2f2a;--accent:#b5654a;--card:#fbf7f1;--veil:rgba(239,230,218,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241d1a;--ink:#f0e6da;--accent:#d98b6d;--card:#2f2622;--veil:rgba(36,29,26,.72)}}

html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#welcome{background:var(--veil);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5}
#welcome h1{font-weight:400;font-size:clamp(30px,6vw,54px);margin:0 0 8px;letter-spacing:.02em}
#welcome p{margin:0 0 28px;font-style:italic;opacity:.8}
button{font:inherit;cursor:pointer}
#enter{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 34px;font-size:18px;letter-spacing:.05em}
.small{font-size:13px;opacity:.65;margin-top:18px}
#panel{display:none;z-index:6;background:rgba(0,0,0,.45)}
#card{background:var(--card);max-width:760px;width:100%;max-height:90%;overflow:auto;border-radius:10px;padding:22px;text-align:left;display:grid;gap:18px;grid-template-columns:1fr 1fr;position:relative}
#card img{width:100%;border-radius:6px;display:block}
#card h2{margin:0 0 4px;font-weight:400;font-size:26px}
.no{color:var(--accent);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.meta{font-size:14px;line-height:1.7;margin:10px 0}.meta b{font-weight:600}
#x{position:absolute;top:8px;right:12px;background:none;border:0;font-size:28px;color:var(--ink)}
@media(max-width:620px){#card{grid-template-columns:1fr}}
#dot{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.35);display:none;pointer-events:none;transition:transform .15s}
#dot.on{transform:scale(2.6);background:#ffd9b8}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.6s;z-index:4}
#hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:13px;opacity:.75;pointer-events:none;color:#fff;text-shadow:0 1px 3px #000;display:none}
#stick{position:fixed;left:24px;bottom:34px;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.6);display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.6)}

for(let i=0;i<8;i++){wg.fillStyle=['#b98a5e','#c39566','#b08256','#bf9160'][i%4];wg.fillRect(0,i*64,512,62);wg.fillStyle='rgba(60,30,10,.35)';wg.fillRect(0,i*64+62,512,2);}
const wt=new THREE.CanvasTexture(wc);wt.wrapS=wt.wrapT=THREE.RepeatWrapping;wt.repeat.set(3,4);wt.encoding=THREE.sRGBEncoding;
plane(2*HW,2*HD,new THREE.MeshStandardMaterial({map:wt,roughness:.6}),[0,0,0],[-Math.PI/2,0,0]);
const wall=mat(0xf3ece2);
plane(2*HW,H,wall,[0,H/2,-HD],[0,0,0]);plane(2*HW,H,wall,[0,H/2,HD],[0,Math.PI,0]);
plane(2*HD,H,wall,[-HW,H/2,0],[0,Math.PI/2,0]);plane(2*HD,H,wall,[HW,H/2,0],[0,-Math.PI/2,0]);
plane(2*HW,2*HD,mat(0xfaf6ef),[0,H,0],[Math.PI/2,0,0]);
const base=mat(0xd8cbb8);[[0,-HD+.02,0],[0,HD-.02,Math.PI]].forEach(s=>{const b=new THREE.Mesh(new THREE.BoxGeometry(2*HW,.14,.04),base);b.position.set(s[0],.07,s[1]);scene.add(b);});
// rug
plane(4,5,mat(0xcfa48f,1),[0,.01,-1],[-Math.PI/2,0,0]);

// interaction
const hit=[];function tag(o,i){o.traverse(m=>{if(m.isMesh){m.userData.art=i;hit.push(m);}});}
const tex=new THREE.TextureLoader();
function label(a){const c=document.createElement('canvas');c.width=320;c.height=120;const g=c.getContext('2d');
 g.fillStyle='#faf6ef';g.fillRect(0,0,320,120);g.strokeStyle='#b5654a';g.strokeRect(4,4,312,112);g.fillStyle='#b5654a';g.font='20px Georgia';g.textAlign='center';g.fillText(a.no,160,38);
 g.fillStyle='#3b2f2a';g.font='italic 26px Georgia';g.fillText(a.title.length>22?a.title.slice(0,21)+'…':a.title,160,80);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}

const PI=Math.PI,FS=[{p:[0,1.8,-HD],r:0,s:1.3},{p:[-HW,1.7,-3.5],r:PI/2,s:1},{p:[-HW,1.7,1.5],r:PI/2,s:1},{p:[HW,1.7,-3.5],r:-PI/2,s:1},{p:[HW,1.7,1.5],r:-PI/2,s:1}];
const PS=[[-2,-2]],MS=[[2,-2]];
const wood=mat(0x8a5a3a,.6),cream=mat(0xf0e8dc,.8);
ARTWORKS.forEach((a,i)=>{
 const col=new THREE.Color(PAL[i%PAL.length][1]);
 if(a.type==='frame'){const s=FS.shift();if(!s)return;const g=new THREE.Group(),w=1.1,h=1.375;
  const f=new THREE.Mesh(new THREE.BoxGeometry(w+.16,h+.16,.06),wood);f.position.z=.03;g.add(f);
  const pic=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex.load(a.img,t=>{t.encoding=THREE.sRGBEncoding;pic.scale.x=(t.image.width/t.image.height)/.8;})}));pic.position.z=.065;g.add(pic);
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(.5,.19),new THREE.MeshBasicMaterial({map:label(a)}));pl.position.set(0,-h/2-.3,.01);g.add(pl);
  g.position.set(...s.p);g.rotation.y=s.r;g.scale.setScalar(s.s);scene.add(g);tag(g,i);pl.userData.art=undefined;hit.splice(hit.indexOf(pl),1);pl.userData.art=i;hit.push(pl);}
 else if(a.type==='pedestal'){const p=PS.shift();if(!p)return;const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.BoxGeometry(.7,1,.7),cream);b.position.y=.5;g.add(b);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(.2,24,16),mat(col,1));ball.position.y=1.2;g.add(ball);
  const gl=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.55),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.16,roughness:0}));gl.position.y=1.28;g.add(gl);
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(.4,.15),new THREE.MeshBasicMaterial({map:label(a)}));pl.position.set(0,.85,.355);g.add(pl);
  g.position.set(p[0],0,p[1]);scene.add(g);tag(g,i);}
 else if(a.type==='mannequin'){const p=MS.shift();if(!p)return;const g=new THREE.Group();
  const add=(geo,m,y)=>{const o=new THREE.Mesh(geo,m);o.position.y=y;g.add(o);return o;};
  add(new THREE.CylinderGeometry(.3,.32,.05,24),wood,.025);add(new THREE.CylinderGeometry(.02,.02,.9,8),wood,.5);
  add(new THREE.CylinderGeometry(.19,.13,.6,20),cream,1.2);add(new THREE.CylinderGeometry(.04,.05,.1,12),cream,1.55);
  add(new THREE.SphereGeometry(.11,20,16),cream,1.68);
  const hb=add(new THREE.TorusGeometry(.115,.022,10,28),mat(col,1),1.72);hb.rotation.x=PI/2;
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(.4,.15),new THREE.MeshBasicMaterial({map:label(a)}));pl.position.set(0,.2,.34);g.add(pl);
  g.position.set(p[0],0,p[1]);scene.add(g);tag(g,i);}
});

// panel
const panel=document.getElementById('panel');let panelOpen=false;
function openP(i){const a=ARTWORKS[i];document.getElementById('pimg').src=a.img;
 const row=(k,v)=>v?`<div><b>${k}:</b> ${v}</div>`:'';
 document.getElementById('ptxt').innerHTML=`<div class="no">Artifact No. ${a.no}</div><h2>${a.title}</h2><div style="opacity:.7;font-style:italic">Handmade Crochet Artwork · ${a.year}</div><div class="meta">${row('Category',a.cat)}${row('Materials',a.materials)}${row('Techniques',a.tech)}${row('Dimensions',a.dims)}${row('Time to create',a.time)}</div><p><i>Inspiration:</i> ${a.insp}</p><p>${a.story}</p>`;
 panel.style.display='flex';panelOpen=true;mv.x=mv.y=0;vel.x=vel.z=0;if(document.exitPointerLock)document.exitPointerLock();}
function closeP(){panel.style.display='none';panelOpen=false;if(entered&&!matchMedia('(pointer:coarse)').matches){try{cv.requestPointerLock()}catch(_){}}}
document.getElementById('x').onclick=closeP;panel.addEventListener('pointerdown',e=>{if(e.target===panel)closeP();});

// controls
const R=new THREE.Raycaster(),V=new THREE.Vector2();
function pick(x,y){V.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);R.setFromCamera(V,cam);const h=R.intersectObjects(hit,false)[0];if(h&&h.object.userData.art!==undefined)openP(h.object.userData.art);}
const keys={};let entered=false,yaw=0,pitch=0,mv={x:0,y:0},look=null,stick=null;
let bob=0,AC;const vel={x:0,z:0},OB=[[-2,-2,.65],[2,-2,.5]]; /* OB = pedestal + mannequin footprints */
const locked=()=>document.pointerLockElement===cv;
document.addEventListener('mousemove',e=>{if(!locked()||panelOpen)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0022));});
function step(){if(!AC)return;const b=AC.createBuffer(1,2200,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
 const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=500;const g=AC.createGain();g.gain.value=.25;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Escape')closeP();});addEventListener('keyup',e=>keys[e.code]=0);
const st=document.getElementById('stick'),kn=document.getElementById('knob'),cl=v=>Math.max(-1,Math.min(1,v));
cv.addEventListener('pointerdown',e=>{if(!entered||panelOpen)return;
 if(locked()){pick(innerWidth/2,innerHeight/2);return;}
 if(e.pointerType==='mouse'){try{cv.requestPointerLock()}catch(_){}}
 cv.setPointerCapture(e.pointerId);
 if(e.pointerType==='touch'&&e.clientX<innerWidth*.4){stick={id:e.pointerId,x:e.clientX,y:e.clientY};st.style.display='block';st.style.left=(e.clientX-55)+'px';st.style.top=(e.clientY-55)+'px';st.style.bottom='auto';}
 else look={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()};});
cv.addEventListener('pointermove',e=>{
 if(stick&&e.pointerId===stick.id){mv.x=cl((e.clientX-stick.x)/50);mv.y=cl((e.clientY-stick.y)/50);kn.style.transform=`translate(${mv.x*30}px,${mv.y*30}px)`;}
 else if(look&&e.pointerId===look.id){yaw-=(e.clientX-look.x)*.005;pitch=Math.max(-1.1,Math.min(1.1,pitch-(e.clientY-look.y)*.005));look.x=e.clientX;look.y=e.clientY;}});
function up(e){if(stick&&e.pointerId===stick.id){stick=null;mv.x=mv.y=0;st.style.display='none';kn.style.transform='';}
 else if(look&&e.pointerId===look.id){if(Math.hypot(e.clientX-look.sx,e.clientY-look.sy)<8&&performance.now()-look.t<400)pick(e.clientX,e.clientY);look=null;}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.getElementById('enter').onclick=()=>{entered=true;document.getElementById('welcome').style.display='none';document.getElementById('hint').style.display='block';setTimeout(()=>document.getElementById('hint').style.opacity=0,8000);
 const fine=!matchMedia('(pointer:coarse)').matches;
 if(fine){document.getElementById('dot').style.display='block';try{cv.requestPointerLock()}catch(_){}}
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}
 const fd=document.getElementById('fade');fd.style.transition='none';fd.style.opacity=1;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{fd.style.transition='';fd.style.opacity=0;}));};

let last=performance.now();
(function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
 if(!entered)yaw=Math.sin(t/6000)*.25;
 else if(!panelOpen){
  if(keys.ArrowLeft)yaw+=1.8*dt;if(keys.ArrowRight)yaw-=1.8*dt;
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-mv.y,s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+mv.x;
  const n=Math.hypot(f,s);if(n>1){f/=n;s/=n;}
  const tx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*2.4,tz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*2.4,k=Math.min(1,dt*8);
  vel.x+=(tx-vel.x)*k;vel.z+=(tz-vel.z)*k;
  let nx=Math.max(-HW+.6,Math.min(HW-.6,cam.position.x+vel.x*dt)),nz=Math.max(-HD+.6,Math.min(HD-.6,cam.position.z+vel.z*dt));
  OB.forEach(o=>{const dx=nx-o[0],dz=nz-o[1],d=Math.hypot(dx,dz);if(d<o[2]&&d>0){nx=o[0]+dx/d*o[2];nz=o[1]+dz/d*o[2];}});
  cam.position.x=nx;cam.position.z=nz;
  const spd=Math.hypot(vel.x,vel.z),pb=Math.sin(bob);bob+=spd*dt*5;
  if(spd>.5&&pb>0&&Math.sin(bob)<=0)step();}
 cam.position.y=1.6+Math.sin(bob)*.03*Math.min(1,Math.hypot(vel.x,vel.z)/2.4);
 cam.rotation.set(pitch,yaw,0);
 if(entered&&!panelOpen){V.set(0,0);R.setFromCamera(V,cam);const h=R.intersectObjects(hit,false)[0];document.getElementById('dot').className=h&&h.distance<6?'on':'';}
 ren.render(scene,cam);})(last);
</script></body></html>
